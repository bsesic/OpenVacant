{% comment %}A single key figure. Expects: label, value, optionally tone.{% endcomment %}
<div class="col-6 col-md-4 col-lg-2">
  <div class="border rounded p-3 h-100">
    <div class="fs-4 fw-semibold {% if tone %}text-{{ tone }}{% endif %}">{{ value }}</div>
    <div class="small text-muted">{{ label }}</div>
  </div>
</div>
