{% load i18n %}
<div id="cookie-banner" class="position-fixed bottom-0 start-0 end-0 m-3 d-none" style="z-index: 1080;">
  <div class="card shadow-sm mx-auto" style="max-width: 720px;">
    <div class="card-body d-flex flex-column flex-md-row align-items-md-center gap-3">
      <p class="mb-0 small flex-grow-1">
        {% blocktrans %}We use cookies that are necessary for the site to work. With your
        consent we also use optional cookies for analytics.{% endblocktrans %}
        <a href="{% url 'pages:privacy' %}">{% trans "Learn more" %}</a>.
      </p>
      <div class="d-flex gap-2">
        <button type="button" class="btn btn-sm btn-outline-secondary" data-cookie-choice="necessary">
          {% trans "Necessary only" %}
        </button>
        <button type="button" class="btn btn-sm btn-primary" data-cookie-choice="all">
          {% trans "Accept all" %}
        </button>
      </div>
    </div>
  </div>
</div>
<script>
  (function () {
    var KEY = "cookie-consent";
    var banner = document.getElementById("cookie-banner");
    if (!banner) return;
    if (!localStorage.getItem(KEY)) banner.classList.remove("d-none");
    banner.querySelectorAll("[data-cookie-choice]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        localStorage.setItem(KEY, btn.getAttribute("data-cookie-choice"));
        banner.classList.add("d-none");
      });
    });
  })();
</script>
