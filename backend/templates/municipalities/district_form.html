{% extends "base.html" %}
{% load i18n crispy_forms_tags %}

{% block title %}{% trans "District" %}{% endblock %}

{% block content %}
  <div class="row justify-content-center">
    <div class="col-lg-6">
      <h1 class="h3 mb-4">
        {% if form.instance.pk %}{{ form.instance.name }}{% else %}{% trans "Add district" %}{% endif %}
      </h1>
      {% crispy form %}
    </div>
  </div>
{% endblock %}
