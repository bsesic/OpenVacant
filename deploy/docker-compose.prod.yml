# Self-contained production stack (alternative to the systemd + host-NGINX setup).
# Build from the repo root:
#   docker compose -f deploy/docker-compose.prod.yml --env-file backend/.env up -d --build
#
# Web runs gunicorn behind an NGINX container that terminates TLS and serves
# static/media from a shared volume. Celery worker + beat run the async queue.
#
# Note on DATABASE_URL: the app prefers DATABASE_URL over the individual DB_*
# variables. Inside Docker the database host is the `db` service, so DATABASE_URL
# is derived here from DB_NAME/DB_USER/DB_PASSWORD and overrides whatever is in
# backend/.env (which may point at 127.0.0.1 for a host/systemd deployment).

# Shared environment for every Django process (web + celery).
x-django-env: &django-env
  DJANGO_DEBUG: "False"
  DATABASE_URL: postgres://${DB_USER:-openvacant}:${DB_PASSWORD:-openvacant}@db:5432/${DB_NAME:-openvacant}
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/0
  CELERY_RESULT_BACKEND: redis://redis:6379/0

# Shared service definition for every Django process.
x-app: &app
  image: ${OPENVACANT_IMAGE:-ghcr.io/bsesic/openvacant-backend:latest}
  build:
    context: ../backend
    dockerfile: Dockerfile
  restart: unless-stopped
  env_file:
    - ../backend/.env
  environment:
    <<: *django-env
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-openvacant}
      POSTGRES_USER: ${DB_USER:-openvacant}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-openvacant}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-openvacant} -d ${DB_NAME:-openvacant}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Persist to disk and cap memory so the cache/broker can't OOM the host.
    command: >-
      redis-server --appendonly yes
                   --maxmemory 256mb
                   --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  web:
    <<: *app
    # CI/CD pulls the prebuilt image (OPENVACANT_IMAGE set by the deploy workflow);
    # locally it falls back to building from ../backend.
    command: >-
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput --clear &&
             gunicorn --bind 0.0.0.0:8000 --workers 3
                      --graceful-timeout 30 --timeout 60
                      --access-logfile - --error-logfile - core.wsgi:application"
    volumes:
      - static_data:/app/staticfiles
      - media_data:/app/media
    healthcheck:
      test:
        - CMD-SHELL
        - "python -c \"import urllib.request as u; u.urlopen('http://localhost:8000/readyz', timeout=5)\""
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  celery_worker:
    <<: *app
    command: celery -A core worker --loglevel=info --concurrency=2
    volumes:
      - media_data:/app/media
    healthcheck:
      test: ["CMD-SHELL", "celery -A core inspect ping -d celery@$$HOSTNAME || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  celery_beat:
    <<: *app
    command: celery -A core beat --loglevel=info

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/openvacant.docker.conf:/etc/nginx/conf.d/default.conf:ro
      - static_data:/var/www/static:ro
      - media_data:/var/www/media:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - web
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

volumes:
  postgres_data:
  redis_data:
  static_data:
  media_data:
