# Production stack for OpenVacant.
#
#   docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env.production up -d
#
# Services: PostGIS, Redis, the application (Gunicorn), a Celery worker, the
# Celery scheduler, and NGINX in front. Postgres and Redis are not published to
# the host: only the compose network reaches them.
#
# TLS is expected to be terminated by a reverse proxy in front of this stack (or
# swap the nginx service for one with certificates mounted). The nginx service
# here trusts X-Forwarded-Proto from that proxy.

x-django-environment: &django-environment
  DJANGO_DEBUG: "False"
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?set DJANGO_SECRET_KEY}
  DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:?set DJANGO_ALLOWED_HOSTS}
  DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-}
  DJANGO_LANGUAGE_CODE: ${DJANGO_LANGUAGE_CODE:-de}
  DJANGO_TIME_ZONE: ${DJANGO_TIME_ZONE:-Europe/Berlin}
  # postgis:// so the spatial backend is used even if the app's normalisation
  # were ever removed.
  DATABASE_URL: postgis://${DB_USER:-openvacant}:${DB_PASSWORD:?set DB_PASSWORD}@db:5432/${DB_NAME:-openvacant}
  USE_REDIS_CACHE: "True"
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/1
  CELERY_RESULT_BACKEND: redis://redis:6379/2
  EMAIL_BACKEND: ${EMAIL_BACKEND:-django.core.mail.backends.smtp.EmailBackend}
  EMAIL_HOST: ${EMAIL_HOST:-}
  EMAIL_PORT: ${EMAIL_PORT:-587}
  EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
  EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
  EMAIL_USE_TLS: ${EMAIL_USE_TLS:-True}
  DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-}
  # NGINX serves the authorised files from its internal location.
  USE_X_ACCEL_REDIRECT: "True"
  PROTECTED_MEDIA_LOCATION: /protected/
  SECURE_SSL_REDIRECT: ${SECURE_SSL_REDIRECT:-False}
  GEOCODER_PROVIDER: ${GEOCODER_PROVIDER:-nominatim}
  GEOCODER_USER_AGENT: ${GEOCODER_USER_AGENT:?set GEOCODER_USER_AGENT with a real contact address}
  MAP_DEFAULT_LATITUDE: ${MAP_DEFAULT_LATITUDE:-50.6236}
  MAP_DEFAULT_LONGITUDE: ${MAP_DEFAULT_LONGITUDE:-12.3036}
  SENTRY_DSN: ${SENTRY_DSN:-}
  SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}

x-app-image: &app-image
  image: ${OPENVACANT_IMAGE:-ghcr.io/bsesic/openvacant-backend:latest}

x-app-volumes: &app-volumes
  - media:/app/media
  - static:/app/staticfiles

services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-openvacant}
      POSTGRES_USER: ${DB_USER:-openvacant}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
      # Locale-aware sorting for German place names.
      POSTGRES_INITDB_ARGS: "--locale=de_DE.UTF-8 --encoding=UTF8"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-openvacant} -d ${DB_NAME:-openvacant}"]
      interval: 10s
      timeout: 5s
      retries: 10
    shm_size: 256mb

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Cache and broker in one instance but separate databases. maxmemory applies
    # to the whole instance, so leave headroom for the queue.
    command: >-
      redis-server
      --save 60 1000
      --maxmemory ${REDIS_MAXMEMORY:-256mb}
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    <<: *app-image
    restart: unless-stopped
    command: >-
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn --bind 0.0.0.0:8000 --workers 3 --worker-class gthread
                      --threads 4 --max-requests 1000 --max-requests-jitter 100
                      --timeout 60 --graceful-timeout 30
                      --forwarded-allow-ips '*'
                      --access-logfile - --error-logfile -
                      core.wsgi:application"
    environment: *django-environment
    volumes: *app-volumes
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  worker:
    <<: *app-image
    restart: unless-stopped
    command: celery -A core worker --loglevel=info --concurrency=2 --max-tasks-per-child=200
    environment: *django-environment
    volumes: *app-volumes
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    <<: *app-image
    restart: unless-stopped
    # Exactly one scheduler, or every nightly job fires twice.
    command: celery -A core beat --loglevel=info --schedule=/tmp/celerybeat-schedule
    environment: *django-environment
    depends_on:
      redis:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/openvacant.docker.conf:/etc/nginx/conf.d/default.conf:ro
      - static:/app/staticfiles:ro
      - media:/app/media:ro
    depends_on:
      - web

volumes:
  postgres_data:
  redis_data:
  media:
  static:
