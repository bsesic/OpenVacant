# NGINX site for OpenVacant.
#
# Replace example.com and the paths, then symlink into sites-enabled.
# TLS certificates are expected from certbot / Let's Encrypt.
#
# The one thing not to change without understanding it: there is no public
# /media/ location. The media root holds expert reports, letters to owners and
# unreleased photographs beside released ones, so serving it directly would
# publish them. Downloads go through the application, which authorises the
# caller and then hands the file back here via the internal /protected/
# location below.

upstream openvacant_app {
    server 127.0.0.1:8000;
    keepalive 16;
}

# Rate limit zones. The citizen report form is the one endpoint an anonymous
# visitor can write through, and the address search proxies an upstream service
# that has its own limits to respect.
limit_req_zone $binary_remote_addr zone=openvacant_write:10m rate=20r/m;
limit_req_zone $binary_remote_addr zone=openvacant_search:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=openvacant_api:10m rate=600r/m;

# HTTP -> HTTPS redirect. The ACME path stays on HTTP so renewals work.
server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name example.com www.example.com;

    # --- TLS ---------------------------------------------------------------
    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling on;
    ssl_stapling_verify on;

    # --- Security headers --------------------------------------------------
    # Django sets HSTS itself when SECURE_HSTS_SECONDS is configured; setting it
    # here as well is harmless and keeps it in place if the app is down.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header X-Frame-Options "DENY" always;
    # Map tiles and the address search come from the configured providers; adjust
    # the connect-src and img-src hosts if a municipality points them elsewhere.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https://*.tile.openstreetmap.org; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # --- Logs --------------------------------------------------------------
    access_log /var/log/nginx/openvacant.access.log;
    error_log  /var/log/nginx/openvacant.error.log;

    # Photographs from phones are large; the application limits the count and
    # the per-file size itself.
    client_max_body_size 25M;
    client_body_timeout 60s;

    # --- Compression -------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/javascript application/json
               application/xml application/geo+json image/svg+xml;

    # --- Static files ------------------------------------------------------
    location /static/ {
        alias /opt/openvacant/backend/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Municipal branding is meant to be public: the logo and coat of arms are on
    # every page. Nothing else under the media root is served directly.
    location /media/branding/ {
        alias /opt/openvacant/backend/media/branding/;
        expires 7d;
        access_log off;
    }

    # Everything else under the media root is delivered only after the
    # application has authorised the caller. "internal" means this location
    # cannot be requested from outside; only an X-Accel-Redirect reaches it.
    location /protected/ {
        internal;
        alias /opt/openvacant/backend/media/;
    }

    # --- Probes ------------------------------------------------------------
    location = /healthz {
        proxy_pass http://openvacant_app;
        proxy_set_header Host $host;
        access_log off;
    }

    location = /readyz {
        proxy_pass http://openvacant_app;
        proxy_set_header Host $host;
        access_log off;
    }

    # --- Rate-limited endpoints -------------------------------------------
    # The only write path open to anonymous visitors.
    location = /reports/new/ {
        limit_req zone=openvacant_write burst=10 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/openvacant-proxy.conf;
    }

    location = /geodata/address-search/ {
        limit_req zone=openvacant_search burst=20 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/openvacant-proxy.conf;
    }

    location /api/ {
        limit_req zone=openvacant_api burst=100 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/openvacant-proxy.conf;
    }

    # --- WebSockets (only when running Daphne for /ws/) -------------------
    location /ws/ {
        proxy_pass http://openvacant_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    # --- Application -------------------------------------------------------
    location / {
        include /etc/nginx/snippets/openvacant-proxy.conf;
    }

    # Never serve dotfiles from a static or media alias.
    location ~ /\. {
        deny all;
    }
}
