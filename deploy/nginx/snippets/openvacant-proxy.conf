# Shared proxy settings. Install as /etc/nginx/snippets/openvacant-proxy.conf.
#
# X-Forwarded-Proto is what lets Django recognise the request as secure via
# SECURE_PROXY_SSL_HEADER, and X-Forwarded-For is what the application reads to
# rate-limit a reporter by address. Both have to be set here, and neither may be
# passed through from the client.
proxy_pass http://openvacant_app;
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_redirect off;
proxy_read_timeout 60s;
proxy_connect_timeout 5s;
