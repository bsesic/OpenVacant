# NGINX for the Docker Compose deployment.
#
# Proxies to the `web` service and serves the static files from the shared
# volume. The same rule as the host configuration applies: the media root is not
# public, and files are delivered only through the application's authorising
# views, which hand them back via the internal /protected/ location.

upstream openvacant_app {
    server web:8000;
    keepalive 16;
}

limit_req_zone $binary_remote_addr zone=openvacant_write:10m rate=20r/m;
limit_req_zone $binary_remote_addr zone=openvacant_api:10m rate=600r/m;

server {
    listen 80;
    server_name _;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header X-Frame-Options "DENY" always;

    client_max_body_size 25M;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               application/geo+json image/svg+xml;

    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        access_log off;
    }

    location /media/branding/ {
        alias /app/media/branding/;
        expires 7d;
        access_log off;
    }

    location /protected/ {
        internal;
        alias /app/media/;
    }

    location = /healthz {
        proxy_pass http://openvacant_app;
        proxy_set_header Host $host;
        access_log off;
    }

    location = /reports/new/ {
        limit_req zone=openvacant_write burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://openvacant_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location /api/ {
        limit_req zone=openvacant_api burst=100 nodelay;
        limit_req_status 429;
        proxy_pass http://openvacant_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location / {
        proxy_pass http://openvacant_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 60s;
    }

    location ~ /\. {
        deny all;
    }
}
