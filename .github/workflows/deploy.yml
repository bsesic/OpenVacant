name: Deploy

# Builds the backend image, pushes it to GHCR, then deploys it on the server
# over SSH (docker compose pull && up -d). Triggered by release tags (vX.Y.Z) or
# manually. Requires these repo secrets:
#   DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY  (optional: DEPLOY_PORT, DEPLOY_PATH)
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}-backend

jobs:
  build-and-push:
    name: Build and push image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          # Always publish :latest so the server can pull the current release.
          tags: |
            type=semver,pattern={{version}}
            type=sha
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy over SSH
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy on server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          # The compose file defaults web to the :latest GHCR image, so a plain
          # pull + up picks up what build-and-push just published.
          script: |
            set -euo pipefail
            cd "${{ secrets.DEPLOY_PATH || '/opt/openvacant' }}"
            git fetch --tags origin
            git checkout --force "${{ github.ref_name }}"
            docker compose -f deploy/docker-compose.prod.yml --env-file backend/.env pull web
            docker compose -f deploy/docker-compose.prod.yml --env-file backend/.env up -d
            docker image prune -f
